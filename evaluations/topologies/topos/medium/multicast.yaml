topology:
    defaults:
        routers:
            multicast: true
            rp_id: 1
            asm_prefix: "224.0.0.0/4"

        links:
            bandwidth: "30Mbit"
            loss: "0%"
            burst: "0%"
            delay: "0ms"
            buffer: 100000
            multicast: true

    # routers: ["router1", "router2", "router3"]
    routers:
        num: 3 # 1 -> 3 incl.
        # overrides:
        #   router3:
        #     multicast: false
        links:
            - endpoints: ["router1", "router2"]
            - endpoints: ["router1", "router3"]
            - endpoints: ["router2", "router3"]

    servers: ["server1"]
    clients:
        num: 3 # 1 -> 3 incl.

    links:
        - endpoints: ["router1", "server1"]
        - endpoints: ["router1", "client1"]
        - endpoints: ["router2", "client2"]
          # delay: "100ms"
        - endpoints: ["router3", "client3"]
          # multicast: false
