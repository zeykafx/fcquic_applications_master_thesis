topology:
    defaults:
        routers:
            multicast: true
            rp_id: 1
            asm_prefix: "224.0.0.0/4"

        links:
            bandwidth: "30Mbit"
            loss: "0%"
            burst: "0%"
            delay: "0ms"
            buffer: 100000
            multicast: true

    routers:
        num: 10
        # overrides:
        #   router3:
        #     multicast: false
        links:
            - endpoints: ["router1", "router2"]
            - endpoints: ["router1", "router6"]
            - endpoints: ["router2", "router7"]
            - endpoints: ["router2", "router3"]
            - endpoints: ["router3", "router4"]
            - endpoints: ["router3", "router8"]
            - endpoints: ["router4", "router5"]
            - endpoints: ["router4", "router9"]
            - endpoints: ["router5", "router10"]
            - endpoints: ["router6", "router7"]
            - endpoints: ["router7", "router8"]
            - endpoints: ["router8", "router9"]
            - endpoints: ["router9", "router10"]

    servers: ["server1"]
    clients:
        num: 20

    links:
        - endpoints: ["router1", "server1"]
        - endpoints: ["router1", "client1"]
        - endpoints: ["router1", "client2"]
        - endpoints: ["router2", "client3"]
        - endpoints: ["router2", "client4"]
        - endpoints: ["router3", "client5"]
        - endpoints: ["router3", "client6"]
        - endpoints: ["router4", "client7"]
        - endpoints: ["router4", "client8"]
        - endpoints: ["router5", "client9"]
        - endpoints: ["router5", "client10"]
        - endpoints: ["router5", "client11"]
        - endpoints: ["router6", "client12"]
        - endpoints: ["router6", "client13"]
        - endpoints: ["router7", "client14"]
        - endpoints: ["router7", "client15"]
        - endpoints: ["router8", "client16"]
        - endpoints: ["router8", "client17"]
        - endpoints: ["router9", "client18"]
        - endpoints: ["router9", "client19"]
        - endpoints: ["router10", "client20"]
        - endpoints: ["router10", "client10"]
