topology:
    defaults:
        routers:
            multicast: true
            rp_id: 2
            asm_prefix: "224.0.0.0/4"
            name_prefix: "r"

        links:
            bandwidth: "100Mbit"
            loss: "0%"
            burst: "0%"
            delay: "1ms"
            buffer: 100000
            multicast: true

    routers:
        num: 3
        links:
            - endpoints: ["r1", "r2"]
            - endpoints: ["r1", "r3"]

    servers: ["server1"]
    clients:
        num: 11

    # RECEIVERS={3, 5, 7, 9, 11}
    # The test will start with only 3 receivers used (client 1 is always included)
    links:
        - endpoints: ["r1", "server1"]

        # Client 1 is the sender
        - endpoints: ["r1", "client1"]

        - endpoints: ["r2", "client2"]
        - endpoints: ["r3", "client3"]

        - endpoints: ["r2", "client4"]
        - endpoints: ["r3", "client5"]

        - endpoints: ["r2", "client6"]
        - endpoints: ["r3", "client7"]

        - endpoints: ["r2", "client8"]
        - endpoints: ["r3", "client9"]

        - endpoints: ["r2", "client10"]
        - endpoints: ["r3", "client11"]
