topology:
    defaults:
        routers:
            multicast: true
            rp_id: 1
            asm_prefix: "224.0.0.0/4"
            name_prefix: "r"
            use_asm: false

        links:
            bandwidth: "10Gbit"
            loss: "0%"
            burst: "0%"
            delay: "1ms"
            buffer: 1000000000
            multicast: true

    routers:
        num: 3
        links:
            - endpoints: ["r1", "r2"]
            - endpoints: ["r1", "r3"]

    servers: ["server1"]
    clients:
        num: 75

    # The test will start with only 3 receivers used (client 1 is always included), then add 2 clients for each test
    links:
        - endpoints: ["r1", "server1"]

        # Client 1 is the sender
        - endpoints: ["r1", "client1"]

        - endpoints: ["r2", "client2"]
        - endpoints: ["r3", "client3"]

        - endpoints: ["r2", "client4"]
        - endpoints: ["r3", "client5"]

        - endpoints: ["r2", "client6"]
