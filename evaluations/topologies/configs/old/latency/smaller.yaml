topology:
    defaults:
        routers:
            multicast: true
            rp_id: 1
            asm_prefix: "224.0.0.0/4"

        links:
            bandwidth: "30Mbit"
            loss: "0%"
            burst: "0%"
            delay: "0ms"
            buffer: 100000
            multicast: true

    routers:
        num: 3 # 1 -> 3 incl.
        # overrides:
          # r2:
            # multicast: false
        links:
            - endpoints: ["r1", "r2"]
            - endpoints: ["r1", "r3"]
            - endpoints: ["r2", "r3"]

    servers: ["server1"]
    clients:
        num: 3

    links:
        - endpoints: ["r1", "server1"]
        - endpoints: ["r1", "client1"]
        - endpoints: ["r2", "client2"]
        - endpoints: ["r3", "client3"]
