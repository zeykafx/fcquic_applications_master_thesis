frr defaults traditional
!
ip forwarding
!
ip prefix-list multicast permit 224.0.0.0/4

ip prefix-list ospf_out seq 5 deny 172.16.0.0 ge 16 le 22 
ip prefix-list ospf_out seq 10 permit any

!
ip route 172.16.0.0/16 172.16.111.254 1
!
interface lo
    ip address 10.158.11.254/32
    ip igmp
    ip pim
    ip igmp immediate-leave
!
interface eno1
    ip address 10.158.8.1/24
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf passive
!

interface gre1
    ip address 192.168.0.6/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf network point-to-point
    tunnel source eno1
!

interface gre2
    ip address 192.168.0.13/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf network point-to-point
    tunnel source eno1
!

router pim
    ssm prefix-list multicast
!
router ospf
    ospf router-id 3.3.3.3
    network 10.158.8.0/24 area 0

    network 192.168.0.4/30 area 0

    network 192.168.0.12/30 area 0

    network 10.158.11.254/32 area 0
    area 0 export-list ospf_out
!
line vty
!