frr defaults traditional
!
ip forwarding
!
ip prefix-list multicast permit 224.0.0.0/4

ip prefix-list ospf_out seq 5 deny 172.16.0.0 ge 16 le 22 
ip prefix-list ospf_out seq 10 permit any

!
ip route 172.16.0.0/16 172.16.79.254 1
!
interface lo
    ip address 10.144.15.254/32
    ip igmp
    ip pim
    ip igmp immediate-leave
!
interface eno1
    ip address 10.144.12.1/24
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf passive
!

interface gre1
    ip address 192.168.0.2/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf network point-to-point
    tunnel source eno1
!

interface gre2
    ip address 192.168.0.5/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf network point-to-point
    tunnel source eno1
!

interface gre3
    ip address 192.168.0.9/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf network point-to-point
    tunnel source eno1
!

router pim
    ssm prefix-list multicast
!
router ospf
    ospf router-id 2.2.2.2
    network 10.144.12.0/24 area 0

    network 192.168.0.0/30 area 0

    network 192.168.0.4/30 area 0

    network 192.168.0.8/30 area 0

    network 10.144.15.254/32 area 0
    area 0 export-list ospf_out
!
line vty
!