frr defaults traditional
!
ip forwarding
!
ip prefix-list multicast permit 224.0.0.0/4

ip prefix-list ospf_out seq 5 deny 172.16.0.0 ge 16 le 22 
ip prefix-list ospf_out seq 10 permit any

!
! ip route 0.0.0.0/0 172.16.111.254 250
ip route 172.16.0.0/16 172.16.111.254 1
!
interface lo
    ip address 10.158.11.254/32
    ip igmp
    ip pim
    ! ip ospf area 0
    ip igmp immediate-leave
!
interface eno1
    ip address 10.158.8.1/24
    ip ospf network point-to-point
    ip pim
    ip igmp
    ip igmp immediate-leave
    ! ip ospf area 0
    ip ospf passive
    ip ospf prefix-suppression 172.16.97.12/20
    ! ip ospf prefix-suppression 1
!
interface gre1
    ip address 192.168.0.2/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ! ip ospf area 0
    ip ospf network point-to-point
    tunnel source eno1
!
router pim
    ssm prefix-list multicast
!
router ospf
    ospf router-id 2.2.2.2
    network 10.158.8.0/24 area 0
    network 192.168.0.2/30 area 0
    network 10.158.11.254/32 area 0
    area 0 export-list ospf_out
!
line vty
!