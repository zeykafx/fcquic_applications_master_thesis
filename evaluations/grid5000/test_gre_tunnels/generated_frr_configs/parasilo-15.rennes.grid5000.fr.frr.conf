frr version 8.4.4
frr defaults traditional
!
ip forwarding
ip prefix-list multicast permit 224.0.0.0/4
!
interface eno1
    ip address 172.16.97.15/20
    ip ospf network point-to-point
    ip pim
    ip igmp
    ip ospf area 0
!
interface gre1
    ip address 192.168.0.2/30
    ip pim
    ip igmp
    ip ospf area 0
    ip ospf network point-to-point
    tunnel source eno1
!
router pim
	bsr candidate-rp priority 102
	bsr candidate-bsr priority 2
	bsr candidate-rp group 224.0.0.0/4
!
router ospf
    ospf router-id 172.16.97.15
    network 172.16.96.0/20 area 0
    network 192.168.0.0/30 area 0
!
line vty
!