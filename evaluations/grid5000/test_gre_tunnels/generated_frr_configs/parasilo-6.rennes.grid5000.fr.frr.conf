frr defaults traditional
!
ip forwarding
!
ip prefix-list multicast permit 224.0.0.0/4
!
ip route 0.0.0.0/0 172.16.111.254 250
!
interface lo
    ip address 10.158.11.254/32
    ip igmp
    ip pim
    ip ospf area 0
    ip igmp immediate-leave
!
interface eno1
    ip address 10.158.8.1/24
    ip ospf network point-to-point
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf area 0
!
interface gre1
    ip address 192.168.0.2/30
    ip pim
    ! ip igmp
    ! ip igmp immediate-leave
    ip ospf area 0
    ip ospf network point-to-point
    tunnel source eno1
!
router pim
    ssm prefix-list multicast
    ! bsr candidate-rp priority 102
    ! bsr candidate-bsr priority 2
    ! bsr candidate-rp group 224.0.0.0/4
!
router ospf
    router-id 2.2.2.2
    network 10.158.8.0/24 area 0
    redistribute connected
    network 192.168.0.0/30 area 0
!
line vty
!