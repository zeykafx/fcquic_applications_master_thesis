frr version 8.4.4
frr defaults traditional
!
ip forwarding
ip prefix-list multicast permit 224.0.0.0/4
!
interface enp3s0f0
    ip address 172.16.192.15/20
    ip ospf network point-to-point
    ip pim
    ip igmp
    ip ospf area 0
!
interface gre1
    ip address 192.168.0.1/30
    ip pim
    ip igmp
    ip ospf area 0
    ip ospf network point-to-point
    tunnel source enp3s0f0
!
router pim
	bsr candidate-rp priority 101
	bsr candidate-bsr priority 1
	bsr candidate-rp group 224.0.0.0/4
!
router ospf
    ospf router-id 172.16.192.15
    network 172.16.192.0/20 area 0
    network 192.168.0.0/30 area 0
!
line vty
!