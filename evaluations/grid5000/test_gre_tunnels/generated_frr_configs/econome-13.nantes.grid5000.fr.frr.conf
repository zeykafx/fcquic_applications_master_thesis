frr defaults traditional
!
ip forwarding
!
ip prefix-list multicast permit 224.0.0.0/4
!
interface lo
    ip address 10.176.3.254/32
    ip igmp
    ip pim
    ip igmp immediate-leave
    ip router isis 1
    isis network point-to-point
    isis metric 1
    isis passive
!
interface enp3s0f0
    ip address 10.176.0.1/24
    ! ip pim
    ip igmp
    ip igmp immediate-leave
    ip router isis 1
    isis network point-to-point
    isis metric 2
    isis passive
!
interface gre1
    ip address 192.168.0.1/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip router isis 1
    isis network point-to-point
    isis metric 0
    no isis three-way-handshake
    tunnel source enp3s0f0
!
router pim
    ssm prefix-list multicast
!
router isis 1
  is-type level-1
  net 49.0000.0000.0000.0002.00
  lsp-timers level-1 gen-interval 5 refresh-interval 10 max-lifetime 1200
  spf-interval 5
!
line vty
!