frr version 8.4.4
frr defaults traditional
!
ip forwarding
!
ip prefix-list multicast permit 224.0.0.0/4
!
interface eno1
    ip address 10.158.4.1/22
    ip ospf network point-to-point
    ip ospf hello-interval 1
    ip ospf dead-interval 4
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf area 0
!
interface gre1
    ip address 192.168.0.2/30
    ip pim
    ip igmp
    ip igmp immediate-leave
    ip ospf area 0
    ip ospf network point-to-point
    ip ospf hello-interval 1
    ip ospf dead-interval 4
    tunnel source eno1
!
router pim
	bsr candidate-rp priority 102
	bsr candidate-bsr priority 2
	bsr candidate-rp group 224.0.0.0/4
!
router ospf
    router-id 2.2.2.2
    timers throttle spf 10 50 5000
    network 10.158.4.0/22 area 0
    network 192.168.0.0/30 area 0
!
line vty
!